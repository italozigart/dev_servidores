<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/produtos}">FATEC - Catálogo</a>

        <div class="d-flex align-items-center gap-3">
            <span sec:authorize="isAuthenticated()" class="text-white small">
                Olá, <strong sec:authentication="name"></strong>
                <span sec:authorize="hasRole('ADMIN')" class="badge bg-warning text-dark ms-1">ADMIN</span>
                <span sec:authorize="hasRole('USER') and !hasRole('ADMIN')" class="badge bg-light text-dark ms-1">USER</span>
            </span>

            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body">

            <h2 class="mb-4 text-center">Editar Produto</h2>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/produtos/editar/{id}(id=${produto.idProduto})}"
                  th:object="${produto}"
                  method="post">

                <input type="hidden" th:field="*{idProduto}">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Produto</label>
                    <input type="text"
                           class="form-control"
                           id="nome"
                           th:field="*{nome}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="valor" class="form-label">Valor</label>
                    <input type="number"
                           step="0.01"
                           class="form-control"
                           id="valor"
                           th:field="*{valor}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoria</label>
                    <select class="form-select"
                            id="categoria"
                            th:field="*{categoria.idCategoria}"
                            required>
                        <option value="">Selecione uma categoria</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.idCategoria}"
                                th:text="${categoria.nome}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Atualizar Produto</button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
