<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - FATEC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/produtos}">FATEC - Catálogo</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white small">
                Olá, <strong sec:authentication="name"></strong>
                <span class="badge bg-warning text-dark ms-1">ADMIN</span>
            </span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gerenciar Usuários</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/produtos}" class="btn btn-outline-secondary">Ver Produtos</a>
            <a th:href="@{/usuarios/novo}" class="btn btn-success">Novo Usuário</a>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.idUsuario}"></td>
                        <td th:text="${u.username}"></td>
                        <td>
                            <span th:if="${u.role == 'ROLE_ADMIN'}" class="badge bg-warning text-dark">Administrador</span>
                            <span th:if="${u.role == 'ROLE_USER'}" class="badge bg-secondary">Usuário</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/usuarios/excluir/{id}(id=${u.idUsuario})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Deseja realmente excluir este usuário?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center text-muted">Nenhum usuário cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
