<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/produtos}">FATEC - Catálogo</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Lista de Categorias</h2>
                <a th:href="@{/categorias/nova}" class="btn btn-primary">Nova Categoria</a>
            </div>

            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.idCategoria}"></td>
                    <td th:text="${categoria.nome}"></td>
                    <td class="text-end">
                        <a th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/categorias/excluir/{id}(id=${categoria.idCategoria})}" class="btn btn-danger btn-sm">Excluir</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="3" class="text-center">Nenhuma categoria cadastrada.</td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/produtos}" class="btn btn-secondary">Voltar para Produtos</a>
        </div>
    </div>
</div>

</body>
</html>
